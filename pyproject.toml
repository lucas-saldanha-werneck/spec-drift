[project]
name = "spec-drift"
version = "0.1.0"
description = "Compare a plain-text endpoint spec with an OpenAPI document and report drift."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spec-drift = "spec_drift.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spec_drift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
